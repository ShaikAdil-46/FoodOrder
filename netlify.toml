# Netlify build settings for the React frontend.
# The Base directory points at the frontend project; `publish` is relative to it.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Set VITE_API_BASE in Netlify > Site settings > Environment variables
# to the Render backend origin, for example https://foodorder-api.onrender.com.
# Without it, the built site points at its own origin and calls will 404.

# Serve the single-page app for any client-side route (React Router).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
