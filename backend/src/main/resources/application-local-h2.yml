server:
  port: ${SERVER_PORT:8090}

spring:
  datasource:
    url: jdbc:h2:mem:foodorder-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
foodorder:
  jwt:
    secret: local-only-h2-signing-secret-change-before-use
    expiration-minutes: 720
